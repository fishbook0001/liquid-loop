[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liquid-loop"
version = "2.2.0"
description = "Self-Organizing Cognitive Memory for AI Agents — Liquid Loop theory implementation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "fishbook0001"}
]
maintainers = [
    {name = "fishbook0001"}
]
keywords = [
    "agent-memory",
    "cognitive-architecture",
    "self-organizing",
    "liquid-loop",
    "entropy",
    "ai-agents",
    "memory-management"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/fishbook0001/liquid-loop"
Repository = "https://github.com/fishbook0001/liquid-loop"
Documentation = "https://github.com/fishbook0001/liquid-loop#readme"
Issues = "https://github.com/fishbook0001/liquid-loop/issues"
Changelog = "https://github.com/fishbook0001/liquid-loop/blob/main/CHANGELOG.md"

[project.scripts]
liquid-loop = "liquid_loop.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["liquid_loop*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.yaml", "*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".git", "__pycache__", "dist", "build", "*.egg-info"]

[tool.ruff.lint]
# ── 分级治理（2026-09-24 实测重定）───────────────────────────────────────
# 背景：本段规则集自声明以来从未真正执行（ruff 未安装），原 select 是"愿望清单"。
#       实测原 select 产出 663 条 → 只能靠 non-blocking 兜着 = **装饰性配置**（形式闭环）。
#       现按"当前可 100% 守住"重定 A 级，让 CI 成为**真门禁**；其余列 backlog 明示。
#
# A 级（已 100% 干净，CI 阻断）：E9(语法错) / F(pyflakes：未定义名·未用导入·重定义) / T20(print)
select = ["E9", "F", "T20"]
ignore = ["T201"]   # T20 内允许 print（CLI 输出需要）

# B 级（存量**未启用**，非"欠债"；2026-09-24 02:50 实测**已机清至 189**）
#
# 📉 清账轨迹（本轮）：
#   504 → 189。已清 315 条 = 语义缺陷类 34 + 现代化层 180(UP*, safe-fix) + 纯空白层 118(W291/293/292)
#   + 人工判断层 12（SIM102×2 / SIM105×2 / SIM114 / SIM118 / E731×2 / C408 真改；
#     SIM103 / SIM905 属**有意保留**，见下）
#
# 剩余 189 = 两类**有理由不做**，不是遗漏：
#   ① E501 line-too-long 141 —— 列宽是**团队约定**（`line-length=100` 目前仅供 formatter 参考，
#      未作 lint 门禁）。属审美决策，且全量重排会扰动 62 个活跃 WIP 文件 → **churn > 收益**。
#   ② I001 unsorted-imports 48 —— **实测已否决**：门面/分片里的导入分组注释
#      （`# ── 数据模型主表面 ──` / `# ── 主体类 ──` 等）是人写的有意结构，
#      自动化排序会把它们打散合并（已跑 `--fix --diff` 见 workspace.py 的破坏性 diff）
#      → **降低可读性，不是修问题**。
#
# 有意保留的 2 处（已就地 `# noqa` + 理由）：
#   guard.py SIM103  —— 确认闸保留显式 `if 高危: return False / return True`，不合并成 `return not (...)`
#   rar.py   SIM905  —— `set("""多行词表""".split())` 比巨型 list 字面量可读
#
# ⚠️ 认知纪律：剩余 189 条**不是"越修越多"的证据**——A/B 级分档后，A 级 = 真门禁（CI 阻断），
#   B 级 = 明确"未打开/已否决"的规则（中性状态），不该计入"问题数"。

[tool.ruff.lint.per-file-ignores]
# 门面与包入口 = 设计上的 re-export 转发面：
#   F401 —— 导入的目的就是转发给别人（薄壳符号集等价铁律），非死代码
#   F403 —— workspace.py 以 `from .workspace_models import *` 转发数据模型主表面
"liquid_loop/workspace.py" = ["F401", "F403"]
"liquid_loop/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true